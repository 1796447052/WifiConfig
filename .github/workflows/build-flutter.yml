name: Build Flutter App

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: flutter_app
      run: flutter pub get
    
    - name: Analyze code
      working-directory: flutter_app
      run: flutter analyze
    
    - name: Run tests
      working-directory: flutter_app
      run: flutter test --no-pub
    
    - name: Build APK (Release)
      working-directory: flutter_app
      run: flutter build apk --release
    
    - name: Build App Bundle (Release)
      working-directory: flutter_app
      run: flutter build appbundle --release
    
    - name: Prepare Android artifacts
      run: |
        mkdir -p dist
        cp flutter_app/build/app/outputs/flutter-apk/app-release.apk dist/wifi-provision-android.apk
        cp flutter_app/build/app/outputs/bundle/release/app-release.aab dist/wifi-provision-android.aab
        
        # Generate checksums
        cd dist
        sha256sum wifi-provision-android.apk > wifi-provision-android.apk.sha256
        sha256sum wifi-provision-android.aab > wifi-provision-android.aab.sha256
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wifi-provision-android
        path: dist/
        retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
    
    - name: Get dependencies
      working-directory: flutter_app
      run: flutter pub get
    
    - name: Build iOS (Release - No Codesign)
      working-directory: flutter_app
      run: flutter build ios --release --no-codesign
    
    - name: Prepare iOS artifacts
      run: |
        mkdir -p dist
        cd flutter_app/build/ios/iphoneos
        zip -r ../../../../dist/wifi-provision-ios.zip Runner.app
        
        cd ../../../../dist
        sha256sum wifi-provision-ios.zip > wifi-provision-ios.zip.sha256
    
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wifi-provision-ios
        path: dist/
        retention-days: 30

  # Release to GitHub Releases
  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    # Run on tag push OR push to main/master branch
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    permissions:
      contents: write
    
    steps:
    - name: Download Android artifacts
      uses: actions/download-artifact@v4
      with:
        name: wifi-provision-android
        path: ./android
    
    - name: Download iOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: wifi-provision-ios
        path: ./ios
    
    - name: Prepare release assets
      run: |
        mkdir -p release_assets
        cp android/wifi-provision-android.apk release_assets/
        cp android/wifi-provision-android.apk.sha256 release_assets/
        cp android/wifi-provision-android.aab release_assets/
        cp android/wifi-provision-android.aab.sha256 release_assets/
        cp ios/wifi-provision-ios.zip release_assets/
        cp ios/wifi-provision-ios.zip.sha256 release_assets/
    
    # For tag releases (e.g., v1.0.0)
    - name: Create Release (Tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: release_assets/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # For main/master branch pushes - update "latest" release
    - name: Create/Update Latest Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build (Bleeding Edge)
        body: |
          ## Latest Development Build
          
          This is an automatically updated release from the latest commit on the `${{ github.ref_name }}` branch.
          
          **Commit:** ${{ github.sha }}
          **Date:** ${{ github.event.head_commit.timestamp }}
          
          ### Included Files:
          - **Android APK** - Direct install for Android devices
          - **Android AAB** - For Google Play Store upload
          - **iOS App** - Unsigned iOS app bundle (requires signing for installation)
          
          > ⚠️ **Warning:** This is a development build and may be unstable. For stable releases, use versioned releases.
        files: release_assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
