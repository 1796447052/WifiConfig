name: Build Linux (ARM64)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'linux/**'
      - '.github/workflows/build-linux.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'linux/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libdbus-1-dev
    
    - name: Build
      run: |
        cd linux
        make clean || true
        make
        
        # Create distribution directory
        mkdir -p ../dist
        
        # Copy binary and service file
        cp ble_provision ../dist/
        cp ble_provision.service ../dist/
    
    - name: Create distribution package
      run: |
        cd dist
        tar -czvf ble-provision-linux-arm64.tar.gz ble_provision ble_provision.service
        
        # Generate checksum
        sha256sum ble-provision-linux-arm64.tar.gz > ble-provision-linux-arm64.tar.gz.sha256
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ble-provision-linux
        path: |
          dist/ble-provision-linux-arm64.tar.gz
          dist/ble-provision-linux-arm64.tar.gz.sha256
        retention-days: 30

  # Release to GitHub Releases
  release:
    needs: build
    runs-on: ubuntu-latest
    # Run on tag push OR push to main/master branch
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    permissions:
      contents: write
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ble-provision-linux
        path: ./artifacts
    
    - name: Prepare release assets
      run: |
        mkdir -p release_assets
        cp artifacts/ble-provision-linux-arm64.tar.gz release_assets/
        cp artifacts/ble-provision-linux-arm64.tar.gz.sha256 release_assets/
    
    # For tag releases (e.g., v1.0.0)
    - name: Create Release (Tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: release_assets/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    # For main/master branch pushes - update "latest" release
    - name: Create/Update Latest Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Build (Bleeding Edge)
        body: |
          ## Latest Development Build
          
          This is an automatically updated release from the latest commit on the `${{ github.ref_name }}` branch.
          
          **Commit:** ${{ github.sha }}
          **Date:** ${{ github.event.head_commit.timestamp }}
          
          > ⚠️ **Warning:** This is a development build and may be unstable. For stable releases, use versioned releases.
        files: release_assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
